[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "phalanx-backend"
version = "0.1.0"
description = "FastAPI backend for Phalanx Cyber Academy"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "python-docx",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pyjwt[crypto]",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
